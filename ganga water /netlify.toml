# ================================================================
# GANGA WATER TANK CLEANING SERVICES — Netlify Configuration
# ================================================================

[build]
  publish = "."

# ── REDIRECTS ────────────────────────────────────────────────
[[redirects]]
  from = "/index"
  to   = "/"
  status = 301

[[redirects]]
  from = "/home"
  to   = "/"
  status = 301

[[redirects]]
  from = "/about"
  to   = "/about-us.html"
  status = 301

[[redirects]]
  from = "/services/*"
  to   = "/services.html"
  status = 301
  force = false

[[redirects]]
  from = "/contact"
  to   = "/contact-us.html"
  status = 301

[[redirects]]
  from = "/privacy"
  to   = "/privacy-policy.html"
  status = 301

[[redirects]]
  from = "/terms"
  to   = "/terms-and-conditions.html"
  status = 301

# 404 catch-all
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

# ── HEADERS ─────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type  = "application/xml"
